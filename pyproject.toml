[project]
name = "ros"
version = "0.2.0"
description = "ROS: investigación profunda, monitorización de fuentes y digestos desde la terminal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.6",
    "uvicorn>=0.29",
]

[project.scripts]
ros = "ros.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ros"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
