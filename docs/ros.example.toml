# Ejemplo de configuración de ROS. Cópialo a ./ros.toml o ~/.config/ros/config.toml.
# Los secretos NO van aquí: solo el nombre de la variable de entorno que los contiene.

# db_path = "~/.ros/ros.db"
# reports_dir = "~/.ros/reports"
timezone = "Europe/Madrid"            # zona de los horarios ("a las 20:00")

# Proveedor de modelos: opencode | openrouter | anthropic | fake
llm = "opencode"
# opencode_api_key_env = "OPENCODE_API_KEY"         # la clave va en esa variable de entorno, nunca aquí
# opencode_base_url = "https://opencode.ai/zen/go/v1"   # OpenCode Go; para Zen: https://opencode.ai/zen/v1

# Modelo por rol (vacío = el del proveedor: glm-5.3 / glm-5.3 / deepseek-v4.1-flash en OpenCode)
# orchestrator_model = "glm-5.3"
# validator_model = "glm-5.3"
# worker_model = "deepseek-v4.1-flash"

# OpenRouter (llm = "openrouter")
# openrouter_model = "openrouter/free"
# openrouter_api_key_env = "OPENROUTER_API_KEY"

# Búsqueda web: duckduckgo | brave | searxng
search_backend = "duckduckgo"
# brave_api_key_env = "BRAVE_API_KEY"
# searxng_url = "http://localhost:8888"

exclude_domains = []                  # dominios que nunca se descargan

# Tope global de gasto diario de todos los seguimientos y digestos (USD)
monitor_daily_cost_usd = 3.0

[budget]                              # valores por defecto de cada investigación
max_rounds = 4
max_sources = 30
max_minutes = 20
max_cost_usd = 1.5
max_tokens = 400000

# Conectores con API oficial (las variables deben existir en el entorno)
# youtube_api_key_env = "YOUTUBE_API_KEY"
# youtube_daily_quota = 10000
# reddit_client_id_env = "REDDIT_CLIENT_ID"
# reddit_client_secret_env = "REDDIT_CLIENT_SECRET"
# x_bearer_token_env = "X_BEARER_TOKEN"
# meta_access_token_env = "META_ACCESS_TOKEN"
# instagram_user_id = ""             # tu cuenta profesional de Instagram

# Entrega de notificaciones (vacío = canal desactivado)
# notify_kinds = ["alert", "digest", "attention"]
# notify_webhook_url = "https://example.com/hooks/ros"   # firma HMAC con $ROS_WEBHOOK_SECRET si existe
# notify_telegram_chat_id = "123456"                     # token del bot en $ROS_TELEGRAM_TOKEN
# notify_email_to = "yo@example.com"
# notify_email_from = "ros@example.com"
# notify_smtp_host = "smtp.example.com"
# notify_smtp_port = 587
# notify_smtp_user = "yo@example.com"                    # contraseña en $ROS_SMTP_PASSWORD

# API local y Obsidian
# api_port = 8765
# obsidian_vault = "~/Obsidian/Notas"
